<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunden-Geldbörse & Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #0984e3;
            --success: #00b894;
            --card-bg: #ffffff;
            --text: #2d3436;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }

        .container { 
            width: 100%;
            max-width: 450px; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            text-align: center;
        }

        h2 { margin-bottom: 20px; font-size: 24px; color: var(--primary); }

        .balance-card { 
            background: linear-gradient(135deg, #0984e3 0%, #6c5ce7 100%);
            color: white; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 20px rgba(9, 132, 227, 0.3);
            margin-bottom: 25px; 
        }

        .balance-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
        .balance-amount { font-size: 32px; font-weight: bold; margin-top: 5px; }

        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: none !important; }

        .action-box { 
            margin-top: 20px; 
            padding: 20px; 
            background: #f1f2f6;
            border-radius: 16px; 
            display: none; 
        }

        .btn { 
            width: 100%;
            padding: 12px 20px; 
            font-size: 16px; 
            font-weight: bold;
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
        }

        .btn-confirm { background-color: var(--success); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>📱 Kunden-Geldbörse</h2>
    
    <div class="balance-card">
        <div class="balance-label">Spielkonto Guthaben</div>
        <div class="balance-amount"><span id="balance">120,00</span> €</div>
    </div>

    <div id="reader"></div>

    <div id="action-box" class="action-box">
        <h3 id="action-title">Transaktion</h3>
        <p id="action-text"></p>
        <button id="btn-action" class="btn btn-confirm" onclick="processTransaction()">Bestätigen</button>
    </div>
</div>

<script>
    let balance = parseFloat(localStorage.getItem('gameBalance')) || 120.00;
    updateBalanceUI();

    let pendingType = null;
    let pendingAmount = 0;

    function updateBalanceUI() {
        document.getElementById('balance').textContent = balance.toFixed(2).replace('.', ',');
        localStorage.setItem('gameBalance', balance.toFixed(2));
    }

    function onScanSuccess(decodedText) {
        const parts = decodedText.split('|');
        if (parts.length !== 2) return;

        pendingType = parts[0];
        pendingAmount = parseFloat(parts[1]);

        const actionBox = document.getElementById('action-box');
        const actionTitle = document.getElementById('action-title');
        const actionText = document.getElementById('action-text');

        if (pendingType === 'PAYMENT') {
            actionTitle.textContent = "🛒 Bezahlen";
            actionText.textContent = `Möchtest du ${pendingAmount.toFixed(2).replace('.', ',')} € bezahlen?`;
        } else if (pendingType === 'TOPUP') {
            actionTitle.textContent = "💳 Guthaben aufladen";
            actionText.textContent = `Möchtest du ${pendingAmount.toFixed(2).replace('.', ',')} € aufladen?`;
        }

        actionBox.style.display = 'block';
    }

    function processTransaction() {
        if (pendingType === 'PAYMENT') {
            if (balance < pendingAmount) {
                alert("❌ Nicht genügend Guthaben! Bitte erst an der Kasse aufladen.");
            } else {
                balance -= pendingAmount;
                alert("✅ Zahlung erfolgreich!");
            }
        } else if (pendingType === 'TOPUP') {
            balance += pendingAmount;
            alert("✅ Guthaben erfolgreich aufgeladen!");
        }

        updateBalanceUI();
        document.getElementById('action-box').style.display = 'none';
        pendingType = null;
        pendingAmount = 0;
    }

    // Kamera initialisieren
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
